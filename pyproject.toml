[project]
name = "comfyui-labnana"
description = "ComfyUI custom nodes for the Labnana (Marswave) image generation API: one node covers text-to-image, image editing and 4K output, plus credit estimation, task history and subscription tools."
version = "2.0.3"
license = { file = "LICENSE" }
authors = [{ name = "exoticknight" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.4,<3"]
classifiers = ["License :: OSI Approved :: Apache Software License"]

[project.urls]
Repository = "https://github.com/exoticknight/ComfyUI-Labnana"
Documentation = "https://labnana.com/docs/openapi/guide"
"Bug Tracker" = "https://github.com/exoticknight/ComfyUI-Labnana/issues"

[tool.comfy]
DisplayName = "ComfyUI Labnana"
PublisherId = "exoticknight"
Icon = "https://raw.githubusercontent.com/exoticknight/ComfyUI-Labnana/main/assets/icon.png"

[tool.ruff.lint]
# N999: the repo/module name "ComfyUI-Labnana" follows the ComfyUI custom-node
# naming convention; it is imported by path, never as a normal module name.
ignore = ["N999"]
